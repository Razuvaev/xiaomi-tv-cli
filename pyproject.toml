[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaomi-tv-cli"
version = "0.1.0"
description = "CLI utility for diagnosing and optimizing Xiaomi Android TV devices over ADB."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Pavel Razuvaev" }
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "PyYAML>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0"
]

[project.scripts]
tvctl = "tvctl.cli:app"

[tool.setuptools]
packages = ["tvctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
